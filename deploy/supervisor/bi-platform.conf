[program:bi-api]
directory=/opt/bi-platform/backend
command=/opt/bi-platform/venv/bin/gunicorn config.wsgi:application -c /opt/bi-platform/deploy/gunicorn.conf.py
environment=DJANGO_SETTINGS_MODULE="config.settings.production"
autostart=true
autorestart=true
stdout_logfile=/var/log/bi-platform/api.log
stderr_logfile=/var/log/bi-platform/api-error.log

[program:bi-celery-fast]
directory=/opt/bi-platform/backend
command=/opt/bi-platform/venv/bin/celery -A config worker -l INFO -Q fast,sql,imports --concurrency=4
environment=DJANGO_SETTINGS_MODULE="config.settings.production"
autostart=true
autorestart=true

[program:bi-celery-heavy]
directory=/opt/bi-platform/backend
command=/opt/bi-platform/venv/bin/celery -A config worker -l INFO -Q python,ml,optimization --concurrency=1
environment=DJANGO_SETTINGS_MODULE="config.settings.production"
autostart=true
autorestart=true

[program:bi-celery-maintenance]
directory=/opt/bi-platform/backend
command=/opt/bi-platform/venv/bin/celery -A config worker -l INFO -Q maintenance --concurrency=1
environment=DJANGO_SETTINGS_MODULE="config.settings.production"
autostart=true
autorestart=true

[program:bi-celery-beat]
directory=/opt/bi-platform/backend
command=/opt/bi-platform/venv/bin/celery -A config beat -l INFO
environment=DJANGO_SETTINGS_MODULE="config.settings.production"
autostart=true
autorestart=true
