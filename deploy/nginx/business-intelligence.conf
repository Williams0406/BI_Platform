upstream bi_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name bi.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bi.example.com;

    # Configure certificates with your ACME/certificate process.
    ssl_certificate /etc/letsencrypt/live/bi.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bi.example.com/privkey.pem;

    client_max_body_size 200m;

    location /static/ {
        alias /opt/bi-platform/backend/staticfiles/;
        expires 7d;
    }

    location /media/ {
        alias /opt/bi-platform/backend/media/;
        internal;
    }

    location / {
        proxy_pass http://bi_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}
